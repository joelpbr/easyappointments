# Local development stack.
#
#   docker compose -f docker-compose.dev.yml up
#
# The code is mounted from the host, so changes are live. Assets are rebuilt on save by the node service.

name: easyappointments-dev

services:
    # Web server (Apache + PHP) with Composer and Xdebug.
    app:
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: development
        command: sh -c 'chmod -R a+w storage && composer install --no-interaction && apache2-foreground'
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            BASE_URL: http://localhost:${APP_PORT:-80}
            DEBUG_MODE: 'true'
            DB_HOST: db
            DB_NAME: easyappointments
            DB_USERNAME: easyappointments
            DB_PASSWORD: secret
            SMTP_HOST: mailpit
            SMTP_PORT: 1025
            XDEBUG_MODE: debug
            XDEBUG_CONFIG: client_host=host.docker.internal
        extra_hosts:
            - host.docker.internal:host-gateway
        volumes:
            - .:/var/www/html
            - ./docker/config.php:/var/www/html/config.php
        depends_on:
            db:
                condition: service_healthy

    # Rebuilds the JS and CSS assets when their sources change.
    node:
        image: node:22-alpine
        user: '${DOCKER_UID:-1000}:${DOCKER_GID:-1000}'
        working_dir: /app
        command: sh -c 'npm install && npm start'
        volumes:
            - .:/app

    # MySQL database, reachable from the host on port 3306.
    db:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: easyappointments
            MYSQL_USER: easyappointments
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: secret
        ports:
            - '${MYSQL_PORT:-3306}:3306'
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
            interval: 5s
            retries: 30

    # Catches every outgoing email, browse them at http://localhost:8025.
    mailpit:
        image: axllent/mailpit:v1.21
        ports:
            - '${MAILPIT_PORT:-8025}:8025'

volumes:
    db-data:
