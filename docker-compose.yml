# Production stack.
#
#   cp .env.example .env    # then fill in the values
#   docker compose up -d
#
# Open BASE_URL in the browser and the installer creates the administrator account.

x-app: &app
    build:
        context: .
        dockerfile: docker/Dockerfile
    image: easyappointments
    restart: unless-stopped
    environment:
        BASE_URL: ${BASE_URL:?Set BASE_URL in .env}
        LANGUAGE: ${LANGUAGE:-english}
        DEBUG_MODE: 'false'
        DB_HOST: db
        DB_NAME: easyappointments
        DB_USERNAME: easyappointments
        DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        SMTP_HOST: ${SMTP_HOST:-}
        SMTP_PORT: ${SMTP_PORT:-587}
        SMTP_USER: ${SMTP_USER:-}
        SMTP_PASS: ${SMTP_PASS:-}
        SMTP_CRYPTO: ${SMTP_CRYPTO:-tls}
        PROXY_IPS: ${PROXY_IPS:-}
    volumes:
        - storage:/var/www/html/storage
    depends_on:
        db:
            condition: service_healthy

services:
    # Web server (Apache + PHP) serving the application.
    app:
        <<: *app
        ports:
            - '${APP_PORT:-80}:80'

    # Runs the calendar synchronization and the data retention cleanup every 15 minutes.
    cron:
        <<: *app
        user: www-data
        command: sh -c 'while true; do php index.php console sync; php index.php console cleanup; sleep 900; done'

    # MySQL database.
    db:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: easyappointments
            MYSQL_USER: easyappointments
            MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
            MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
            interval: 5s
            retries: 30

volumes:
    db-data:
    storage:
