# Production stack.
#
#   cp .env.example .env    # then fill in the values
#   docker compose up -d
#
# Open BASE_URL in the browser and the installer creates the administrator account.

name: easyappointments

x-logging: &logging
    driver: json-file
    options:
        max-size: 10m
        max-file: '5'

x-app: &app
    build:
        context: .
        dockerfile: docker/Dockerfile
    image: easyappointments
    restart: unless-stopped
    logging: *logging
    environment:
        BASE_URL: ${BASE_URL:?Set BASE_URL in .env}
        LANGUAGE: ${LANGUAGE:-catalan}
        TZ: ${TZ:-Europe/Madrid}
        DEBUG_MODE: 'false'
        DB_HOST: db
        DB_NAME: easyappointments
        DB_USERNAME: easyappointments
        DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        SMTP_HOST: ${SMTP_HOST:-}
        SMTP_PORT: ${SMTP_PORT:-587}
        SMTP_USER: ${SMTP_USER:-}
        SMTP_PASS: ${SMTP_PASS:-}
        SMTP_CRYPTO: ${SMTP_CRYPTO-tls}
        PROXY_IPS: ${PROXY_IPS:-}
        BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
        - storage:/var/www/html/storage
    depends_on:
        db:
            condition: service_healthy

services:
    # Web server (Apache + PHP) serving the application.
    app:
        <<: *app
        ports:
            - '${APP_PORT:-80}:80'
        healthcheck:
            test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost/']
            interval: 30s
            timeout: 5s
            retries: 3

    # Scheduled tasks: calendar sync, data cleanup and the daily backup (see docker/cron.sh).
    cron:
        <<: *app
        user: www-data
        command: ['ea-cron']

    # MySQL database.
    db:
        image: mysql:8.4
        restart: unless-stopped
        logging: *logging
        environment:
            MYSQL_DATABASE: easyappointments
            MYSQL_USER: easyappointments
            MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
            MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
            TZ: ${TZ:-Europe/Madrid}
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
            interval: 5s
            retries: 30

volumes:
    db-data:
    storage:
